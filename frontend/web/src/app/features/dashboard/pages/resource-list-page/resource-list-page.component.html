<section>
  <h2 class="text-xl font-bold capitalize mb-4">{{ type }}</h2>
  @if (resources.length === 0) {
    <div>
      <p>No hay {{ type }} disponibles.</p>
    </div>
  }
  <ul class="space-y-2">
    @for (resource of resources; track $index) {
      <li class="p-4 bg-gray-100 rounded">
        {{ resource.name || resource.title }}
      </li>
    }
  </ul>
</section>
