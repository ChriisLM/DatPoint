<main class="">
  <dtp-preview-section [sectionInfo]="recentInfo" />
  <div class="container mx-auto p-6">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-light-primary mb-2">Mis Recursos</h1>
      <p class="text-light-muted">
        Seleccionados: {{ selectedResources.length }} de {{ resources.length }}
      </p>
    </div>

    <div
      class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"
    >
      @for (resource of resources; track resource.id) {
      <dtp-card-resource
        [resource]="resource"
        [selectedResources]="selectedResources"
        (selectionChange)="onSelectionChange($event)"
      />
      }
    </div>
